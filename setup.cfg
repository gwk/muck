# Dedicated to the public domain under CC0: https://creativecommons.org/publicdomain/zero/1.0/.

# put build products in _build wherever possible.

[metadata]
name = muck
license = CC0
author = George King
author_email = george.w.king@gmail.com
url = https://github.com/gwk/muck
description = Muck is a build tool for data projects that automatically calculates dependencies.
packages =
  muck
  muck.pithy
keywords =
  build
  build system
  build tool
  data science
  diff
  documentation
  markdown
  markup
  pat
  patch
  scripting
  writeup
classifiers =
  Development Status :: 3 - Alpha
  Environment :: Console
  Intended Audience :: Developers
  Intended Audience :: Education
  Intended Audience :: Information Technology
  Intended Audience :: Science/Research
  License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication
  Programming Language :: Python :: 3 :: Only
  Topic :: Documentation
  Topic :: Education
  Topic :: Internet
  Topic :: Multimedia
  Topic :: Software Development
  Topic :: Software Development :: Build Tools
  Topic :: Software Development :: Documentation
  Topic :: Text Processing
  Topic :: Text Processing :: Markup
  Topic :: Text Processing :: Markup :: HTML

[build]
build_base=_build

[sdist]
dist_dir=_build
